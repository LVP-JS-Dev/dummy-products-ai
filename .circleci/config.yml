version: 2.1

parameters:
  manual:
    type: boolean
    default: false

workflows:
  build_and_publish_images:
    when:
      or:
        - equal: [ true, << pipeline.parameters.manual >> ]
        - equal: [ main, << pipeline.git.branch >> ]
    jobs:
      - build_and_push_web
      - build_and_push_docs

  publish_burlaki:
    jobs:
      - publish_burlaki:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

jobs:
  build_and_push_web:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and push web image
          command: |
            set -euo pipefail
            GIT_SHA="$(git rev-parse --short HEAD)"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker buildx create --use
            docker buildx build \
              --platform linux/amd64 \
              -f deploy/docker/web.Dockerfile \
              -t ghcr.io/${GHCR_USERNAME}/dummy-products-web:stage-${GIT_SHA} \
              --push .

  build_and_push_docs:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Build and push docs image
          command: |
            set -euo pipefail
            GIT_SHA="$(git rev-parse --short HEAD)"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            docker buildx create --use
            docker buildx build \
              --platform linux/amd64 \
              -f deploy/docker/docs.Dockerfile \
              -t ghcr.io/${GHCR_USERNAME}/dummy-products-docs:stage-${GIT_SHA} \
              --push .

  publish_burlaki:
    docker:
      - image: cimg/node:20.11
    steps:
      - checkout
      - run:
          name: Verify tag matches package version
          command: |
            set -euo pipefail
            TAG="${CIRCLE_TAG:-}"
            if [ -z "$TAG" ]; then
              echo "Not a tag build; skipping publish."
              exit 0
            fi
            VERSION="$(node -p "require('./packages/burlaki/package.json').version")"
            if [ "v${VERSION}" != "$TAG" ]; then
              echo "Tag ($TAG) does not match package.json version (v${VERSION})."
              exit 1
            fi
      - run:
          name: Publish package
          command: |
            set -euo pipefail
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
            corepack enable
            pnpm install --frozen-lockfile
            pnpm -C packages/burlaki publish --access public
