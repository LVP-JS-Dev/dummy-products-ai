name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build_web:
    name: Build and push web image
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}
      - name: Build and push web image
        run: |
          set -euo pipefail
          GIT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          docker buildx build \
            --platform linux/amd64 \
            -f deploy/docker/web.Dockerfile \
            -t ghcr.io/${GHCR_USERNAME}/dummy-products-web:stage-${GIT_SHA} \
            --push .

  build_docs:
    name: Build and push docs image
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GHCR_USERNAME }}
          password: ${{ env.GHCR_TOKEN }}
      - name: Build and push docs image
        run: |
          set -euo pipefail
          GIT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          docker buildx build \
            --platform linux/amd64 \
            -f deploy/docker/docs.Dockerfile \
            -t ghcr.io/${GHCR_USERNAME}/dummy-products-docs:stage-${GIT_SHA} \
            --push .

  publish_burlaki:
    name: Publish burlaki
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.11"
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -p "require('./packages/burlaki/package.json').version")"
          if [ "v${VERSION}" != "$TAG" ]; then
            echo "Tag ($TAG) does not match package.json version (v${VERSION})."
            exit 1
          fi
      - name: Publish package
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          corepack enable
          pnpm install --frozen-lockfile
          pnpm -C packages/burlaki publish --access public
