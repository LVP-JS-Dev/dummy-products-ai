default_agents = ['codex', 'gemini-cli']
# OpenSpec can update its own assistant configs (e.g. .claude/commands);
# Ruler is scoped to codex artifacts in this repository.

[agents.claude]
enabled = false

[agents.codex]
enabled = true
output_path = 'AGENTS.md'
output_path_config = '.codex/config.toml'

[agents.codex.mcp]
enabled = true
merge_strategy = 'merge'

[agents.gemini-cli]
enabled = true
output_path = 'GEMINI.md'

[skills]
enabled = true

[gitignore]
enabled = false

[mcp]
enabled = true
merge_strategy = 'merge'

[mcp_servers.context7]
args = ['-y', '@upstash/context7-mcp']
command = 'npx'
