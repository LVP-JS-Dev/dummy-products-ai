default_agents = [ 'claude' ]

[agents.claude]
enabled = true
output_path = 'CLAUDE.md'

    [agents.claude.mcp]
    enabled = true
    merge_strategy = 'merge'

[agents.codex]
enabled = true
output_path = 'AGENTS.md'
output_path_config = '.codex/config.toml'

    [agents.codex.mcp]
    enabled = true
    merge_strategy = 'merge'

[agents.gemini-cli]
enabled = true
output_path = 'GEMINI.md'

[gitignore]
enabled = true

[mcp]
enabled = true
merge_strategy = 'merge'

[mcp_servers.context7]
args = [ '-y', '@upstash/context7-mcp' ]
command = 'npx'

[mcp_servers.figma-bridge]
args = [ '-y', '@gethopp/figma-mcp-bridge@0.0.5' ]
command = 'npx'

[skills]
enabled = true
