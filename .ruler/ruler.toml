default_agents = [ 'claude', 'gemini-cli', 'codex' ]

[agents.claude]
enabled = true
output_path = 'CLAUDE.md'

[agents.codex]
enabled = true
output_path = 'AGENTS.md'
output_path_config = '.codex/config.toml'

    [agents.codex.mcp]
    enabled = true
    merge_strategy = 'merge'

[agents.gemini-cli]
enabled = true

[gitignore]
enabled = true

[mcp]
enabled = true
merge_strategy = 'merge'

[mcp_servers.context7]
args = [ '-y', '@upstash/context7-mcp' ]
command = 'npx'