steps:
  - label: ":docker: Build and push web image"
    if: build.branch == "master" || build.env("MANUAL") == "true"
    commands:
      - "set -euo pipefail"
      - "GIT_SHA=$(echo \"$BUILDKITE_COMMIT\" | cut -c1-7)"
      - "echo \"$GHCR_TOKEN\" | docker login ghcr.io -u \"$GHCR_USERNAME\" --password-stdin"
      - "docker buildx create --use"
      - "docker buildx build --platform linux/amd64 -f deploy/docker/web.Dockerfile -t ghcr.io/${GHCR_USERNAME}/dummy-products-web:stage-${GIT_SHA} --push ."

  - label: ":docker: Build and push docs image"
    if: build.branch == "master" || build.env("MANUAL") == "true"
    commands:
      - "set -euo pipefail"
      - "GIT_SHA=$(echo \"$BUILDKITE_COMMIT\" | cut -c1-7)"
      - "echo \"$GHCR_TOKEN\" | docker login ghcr.io -u \"$GHCR_USERNAME\" --password-stdin"
      - "docker buildx create --use"
      - "docker buildx build --platform linux/amd64 -f deploy/docker/docs.Dockerfile -t ghcr.io/${GHCR_USERNAME}/dummy-products-docs:stage-${GIT_SHA} --push ."

  - label: ":package: Publish burlaki"
    if: build.tag != null && build.tag =~ /^v.*/
    commands:
      - "set -euo pipefail"
      - "TAG=\"${BUILDKITE_TAG:-}\""
      - "if [ -z \"$TAG\" ]; then echo \"Not a tag build; skipping publish.\"; exit 0; fi"
      - "VERSION=$(node -p \"require('./packages/burlaki/package.json').version\")"
      - "if [ \"v${VERSION}\" != \"$TAG\" ]; then echo \"Tag ($TAG) does not match package.json version (v${VERSION}).\"; exit 1; fi"
      - "echo \"//registry.npmjs.org/:_authToken=${NPM_TOKEN}\" > ~/.npmrc"
      - "corepack enable"
      - "pnpm install --frozen-lockfile"
      - "pnpm -C packages/burlaki publish --access public"
