# CodeRabbit Configuration
# Schema: https://coderabbit.ai/integrations/schema.v2.json
# Docs: https://docs.coderabbit.ai/guides/configure/coderabbit

language: ru

# Профиль ревью: "assertive" (более строгий) или "chill" (мягкий)
reviews:
  profile: "assertive"
  
  # Запросить changes при критичных issue
  request_changes_workflow: true
  
  # Краткое summary вверху PR
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  
  # Отключить poem
  poem: false
  
  # Статус ревью в checks
  review_status: true
  
  # Статистика изменений
  collapse_walkthrough: false
  
  # Sequence diagrams
  sequence_diagrams: true
  
  # Анализ linked issues
  assess_linked_issues: true
  
  # Пути для игнорирования
  path_filters:
    - "!packages/ui-kit/src/generated/**"
    - "!packages/gen-api/generated/**"
    - "!**/*.gen.ts"
    - "!**/node_modules/**"
    - "!pnpm-lock.yaml"
    - "!**/dist/**"
    - "!**/.turbo/**"

# Настройки чата
chat:
  auto_reply: true

# Knowledge base для контекста проекта
knowledge_base:
  opt_out: false
  learnings:
    scope: "local"
