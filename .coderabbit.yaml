# CodeRabbit Configuration
# Docs: https://docs.coderabbit.ai/configure/coderabbit-yaml

language: ru

# Профиль ревью: "assertive" (более строгий) или "chill" (мягкий)
reviews:
  profile: "assertive"
  
  # Запросить changes при критичных issue
  request_changes_workflow: true
  
  # Краткое summary вверху PR
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  
  # Генерировать poem (можно отключить)
  poem: false
  
  # Статус ревью в checks
  review_status: true
  
  # Статистика изменений
  collapse_walkthrough: false
  
  # Auto-review триггеры
  sequence_diagrams: true
  assess_linked_issues: true
  
  # Пути для игнорирования
  path_filters:
    - "!packages/ui-kit/src/generated/**"
    - "!packages/gen-api/generated/**"
    - "!**/*.gen.ts"
    - "!**/node_modules/**"
    - "!pnpm-lock.yaml"
    - "!**/dist/**"
    - "!**/.turbo/**"
  
  # Автоматические actions
  auto_review:
    # Авто-ревью при открытии PR
    enabled: true
    
    # Игнорировать draft PR
    drafts: false
    
    # Игнорировать WIP в заголовке
    ignore_title_keywords:
      - "WIP"
      - "DO NOT REVIEW"
      - "[WIP]"
  
  # Инструменты анализа
  tools:
    # Статический анализ
    ast-grep:
      essential_rules: true
    
    # Security checks
    gitleaks:
      enabled: true

# Настройки чата
chat:
  auto_reply: true

# Knowledge base для контекста проекта
knowledge_base:
  # Использовать кодовую базу для контекста
  opt_out: false
  
  # Дополнительные инструкции
  learnings:
    scope: "local"  # только для этого репо
